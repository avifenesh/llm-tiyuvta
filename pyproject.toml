[project]
name = "llm-tiyuvta"
version = "0.1.3"
description = "Retired: the tiyuvta inference endpoint closed on 2026-09-28. Tiyuvta now builds AI integration for non-tech companies: https://tiyuvta.ai/"
readme = "README.md"
authors = [{ name = "Avi Fenesh" }]
license = "Apache-2.0"
requires-python = ">=3.9"
classifiers = ["Development Status :: 7 - Inactive"]
# llm>=0.26: supports_tools landed there; on 0.24/0.25 registration TypeErrors
dependencies = ["llm>=0.26", "httpx", "click"]

[project.urls]
Homepage = "https://tiyuvta.ai/"
Source = "https://github.com/avifenesh/llm-tiyuvta"
Changelog = "https://github.com/avifenesh/llm-tiyuvta/releases"
Issues = "https://github.com/avifenesh/llm-tiyuvta/issues"

[project.entry-points.llm]
tiyuvta = "llm_tiyuvta"

[project.optional-dependencies]
test = ["pytest", "pytest-httpx"]

[build-system]
# >=77 for the PEP 639 SPDX license string
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
